# Workspace root. It is not a package itself: it only pins shared dev tooling
# and lists the workspace members. Each member (libs/*, services/*) has its own
# pyproject.toml, its own dependencies and, where it ships, its own Dockerfile.
# See docs/adr/0002-monorepo-with-contract-based-coupling.md.

[project]
name = "nyc-taxi-lakehouse-mlops"
version = "0.1.0"
description = "Lakehouse + MLOps platform for NYC Yellow Taxi trip-duration prediction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "duckdb>=2.0",
    "httpx2>=2.13",  # starlette's TestClient requires httpx2 (plain httpx is deprecated)
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pyyaml>=6.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]
# Data versioning (DVC with an S3-compatible remote).
data = ["dvc[s3]>=3.60"]
# Exploratory analysis (notebooks/). Not installed in any image.
eda = [
    "duckdb>=1.4",
    "ipykernel>=7.0",
    "jupytext>=1.17",
    "matplotlib>=3.10",
    "nbconvert>=7.16",
    "pandas>=2.3",
]

[tool.uv]
package = false
required-version = ">=0.13.5"

[tool.uv.workspace]
members = ["libs/*", "services/*", "jobs/*"]
# transform/dbt is deliberately NOT a member: dbt-databricks pins pydantic<2.13, which
# conflicts with libs/contracts. It has its own pyproject + uv.lock (ADR-0002).
exclude = ["transform/dbt"]

# --------------------------------------------------------------------------- #
# Ruff: lint + format                                                          #
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "S",       # bandit (security)
    "SIM",     # simplify
    "C4",      # comprehensions
    "DTZ",     # naive/aware datetime mistakes (timestamps are core to this data)
    "PT",      # pytest style
    "ARG",     # unused arguments
    "PTH",     # pathlib over os.path
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# S608: tests and dev tools build SQL from trusted constants (rule definitions, fixed names).
"**/tests/**" = ["S101", "ARG001", "ARG002", "S608"]
"tools/**" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["taxi_contracts", "taxi_api", "taxi_ingest", "taxi_export_gold", "taxi_features", "taxi_train", "lakehouse_rules", "conftest"]

# --------------------------------------------------------------------------- #
# Mypy: strict type checking                                                   #
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = [
    "libs",
    "services",
    "jobs",
    "databricks/src/taxi_pipeline/lakehouse_rules",
    "databricks/tests",
    "tests",
    "tools",
]
# Every member has a top-level `tests/` directory; map them to distinct modules.
explicit_package_bases = true
mypy_path = [
    "libs/contracts/src",
    "services/api/src",
    "jobs/ingest/src",
    "jobs/export_gold/src",
    "jobs/train/src",
    "libs/features/src",
    "databricks/src/taxi_pipeline",
    "databricks/tests",
]

[[tool.mypy.overrides]]
module = [
    "pyarrow", "pyarrow.*", "boto3", "boto3.*", "botocore", "botocore.*",
    "sklearn", "sklearn.*", "lightgbm", "lightgbm.*", "optuna", "optuna.*",
    "mlflow", "mlflow.*", "pandas", "pandas.*",
]  # no (complete) type stubs
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# Pytest + coverage                                                            #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["libs", "services", "jobs", "databricks/tests", "tests"]
pythonpath = ["databricks/src/taxi_pipeline", "databricks/tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
xfail_strict = true
filterwarnings = [
    "error",
    # Third-party (MLflow's SQLAlchemy store), not our code; remove when MLflow updates.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
    # Third-party (MLflow input-example code vs pandas 3 Arrow-backed column labels).
    "ignore:Operation with range is deprecated",
    # Third-party (raised while MLflow imports its own chat-agent loader).
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
    # MLflow hint that int columns cannot hold NaN. Our contract forbids missing zone IDs.
    # As an *error* it is swallowed inside MLflow's signature code and silently degrades
    # the logged model, so it must stay a warning.
    "ignore:.*Inferred schema contains integer column:UserWarning",
]

[tool.coverage.run]
branch = true
source = [
    "taxi_contracts",
    "taxi_api",
    "taxi_ingest",
    "taxi_export_gold",
    "taxi_features",
    "taxi_train",
    "lakehouse_rules",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
