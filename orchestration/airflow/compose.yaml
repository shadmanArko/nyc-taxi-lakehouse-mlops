# Local Airflow 3 stack (LocalExecutor + Postgres), hardened like the other services.
#   make airflow-up    -> http://127.0.0.1:8080
#
# Needs two local files (both gitignored):
#   orchestration/airflow/.env                       non-secret settings + generated keys
#   orchestration/airflow/secrets/connections.json   Airflow connections (see the example)
#
# LOCAL ONLY: the UI has no login (all users are admin) and Postgres uses a local
# password. The server deployment uses file-based secrets and real auth (Phase 6).

name: taxi-airflow

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-airflow: &airflow
  <<: *hardening
  build:
    context: ../..
    dockerfile: orchestration/airflow/Dockerfile
  image: taxi-airflow:local
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    TAXI_DAG_SCHEDULE: "none"   # local: manual runs only (`make airflow-run`)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    # Airflow 3 runs tasks in a separate worker process that reads [workers] settings,
    # so the secrets backend must be configured for both the services and the workers.
    AIRFLOW__SECRETS__BACKEND: airflow.secrets.local_filesystem.LocalFilesystemBackend
    AIRFLOW__SECRETS__BACKEND_KWARGS: '{"connections_file_path": "/run/secrets/airflow_connections.json"}'
    AIRFLOW__WORKERS__SECRETS_BACKEND: airflow.secrets.local_filesystem.LocalFilesystemBackend
    AIRFLOW__WORKERS__SECRETS_BACKEND_KWARGS: '{"connections_file_path": "/run/secrets/airflow_connections.json"}'
  secrets:
    # The filesystem backend picks the parser from the extension, so mount it as .json.
    - source: airflow_connections
      target: airflow_connections.json
  volumes:
    - airflow-logs:/opt/airflow/logs
    - taxi-data:/opt/airflow/data
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach the SSH-tunnelled object storage
  depends_on:
    postgres: {condition: service_healthy}
  networks: [airflow]

secrets:
  airflow_connections:
    file: ./secrets/connections.json

services:
  postgres:
    <<: *hardening
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # entrypoint drops to the postgres user
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    mem_limit: 512m
    networks: [airflow]

  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["db", "migrate"]

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports: ["127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v2/version"]
      interval: 30s
      start_period: 60s
      retries: 5
    mem_limit: 2g
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    mem_limit: 2g
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    mem_limit: 1g
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-triggerer:
    <<: *airflow
    command: ["triggerer"]
    mem_limit: 1g
    depends_on:
      airflow-init: {condition: service_completed_successfully}

volumes:
  postgres-data:
  airflow-logs:
  taxi-data:

networks:
  airflow:
    name: taxi-airflow
