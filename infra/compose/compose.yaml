# Local serving stack: web (UI + reverse proxy) -> api -> MLflow registry.
#   make up      (or: docker compose -f infra/compose/compose.yaml up -d --build --wait)
#   UI:  http://127.0.0.1:8088      API (direct, for curl): http://127.0.0.1:8000
#
# Hardening mirrors the homelab server's container rules (docs/deployment.md):
# loopback-only ports, non-root, all capabilities dropped, no-new-privileges,
# read-only root filesystem, CPU/RAM limits, health check, log rotation.

name: taxi-mlops

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *hardening
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: taxi-api:local
    environment:
      TAXI_API_LOG_LEVEL: ${TAXI_API_LOG_LEVEL:-INFO}
      # Serve the registry champion; hot-reloads when the alias moves.
      TAXI_API_MODEL_URI: ${TAXI_API_MODEL_URI:-models:/taxi-trip-duration@champion}
      TAXI_API_MODEL_REFRESH_SECONDS: ${TAXI_API_MODEL_REFRESH_SECONDS:-60}
      # Server MLflow through the Mac's SSH tunnel (needs host.docker.internal:15050 in the
      # server's MLflow --allowed-hosts). On the server itself: http://mlflow:5000.
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://host.docker.internal:15050}
      MLFLOW_DISABLE_AGENT_HINT: "1"
      # Local copy of the served model: a woken container serves within seconds (ADR-0010).
      TAXI_API_MODEL_CACHE_DIR: /models
    volumes:
      - model-cache:/models
    labels:
      # Scale-to-zero: the gateway's Sablier starts this on demand, stops it when idle.
      sablier.enable: "true"
      sablier.group: taxi-serving
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Never 0.0.0.0. The host port is configurable per environment.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    tmpfs:
      - /tmp:size=256m   # the model (~40 MB) is downloaded here at startup
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      # Probe every second while starting: Sablier waits for "healthy" before letting a
      # woken request through, so the first check must not wait a full 30 s interval.
      start_period: 60s
      start_interval: 1s
      retries: 3
    networks: [serving]

  web:
    <<: *hardening
    build:
      context: ../../services/web
    image: taxi-web:local
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8088}:8080"
    tmpfs:
      - /tmp:size=16m
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
    labels:
      sablier.enable: "true"
      sablier.group: taxi-serving
    depends_on:
      api: {condition: service_healthy}
    networks: [serving]

volumes:
  model-cache:

networks:
  serving:
    name: taxi-mlops-serving
