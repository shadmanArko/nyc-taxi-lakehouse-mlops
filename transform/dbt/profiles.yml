# No secrets here: everything sensitive comes from environment variables.
# Inside a Databricks job (dbt_task with warehouse_id) Databricks generates its own
# profile and this file is not used.
taxi:
  target: ci
  outputs:
    ci:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'target/ci.duckdb') }}"
      threads: 4
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') | trim('/') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('TAXI_CATALOG', 'workspace') }}"
      schema: "{{ env_var('TAXI_GOLD_SCHEMA', 'taxi_gold') }}"
      threads: 4
