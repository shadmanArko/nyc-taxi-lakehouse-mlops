# Public entry point: serves the static UI and proxies a small allow-list of API routes.
# This is what the Phase 6 tunnel exposes, so it carries the protections from ADR-0004:
# per-client rate limits, tiny request bodies, strict security headers, no admin routes.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;

    # Writable paths live in /tmp (tmpfs): the root filesystem is read-only.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # 5 predictions/s per client (burst 10); 20 req/s for everything else.
    limit_req_zone $binary_remote_addr zone=predict:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_status 429;

    upstream api { server api:8000; keepalive 8; }

    server {
        listen 8080;
        client_max_body_size 2k;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz { access_log off; return 200 "ok\n"; }

        location / {
            limit_req zone=general burst=40 nodelay;
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            expires 10m;
        }

        # Only these API routes are public; everything else under /api/ is a 404.
        location = /api/predict {
            limit_req zone=predict burst=10 nodelay;
            limit_except POST { deny all; }
            proxy_pass http://api/predict;
            include /etc/nginx/proxy_common.conf;
        }
        location ~ ^/api/(zones|ready|health|portal)$ {
            limit_req zone=general burst=40 nodelay;
            limit_except GET { deny all; }
            proxy_pass http://api/$1;
            include /etc/nginx/proxy_common.conf;
        }
        location /api/ { return 404; }
    }
}
