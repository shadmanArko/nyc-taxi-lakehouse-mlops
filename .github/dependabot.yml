version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }

  # Also updates ruff/mypy/pytest: the pre-commit hooks run them from the venv.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build" }

  - package-ecosystem: docker
    directory: /services/api
    schedule: { interval: weekly }
    groups:
      base-images: { patterns: ["*"] }  # builder + runtime move together
    ignore:
      # The venv is built on one Python minor and copied into the runtime image.
      # A minor bump (3.13 -> 3.14) is a deliberate, repo-wide change, not a bot PR.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message: { prefix: "build" }

  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: weekly }
    groups:
      hooks: { patterns: ["*"] }
    commit-message: { prefix: "ci" }
