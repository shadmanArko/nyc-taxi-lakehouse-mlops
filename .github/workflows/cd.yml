# Continuous delivery: publish the service images to GHCR, only for commits on main
# whose CI run passed. The server pulls these exact images (by commit SHA tag); it never
# builds from source. Deploying them is a separate, operator-approved step (docs/deployment.md).
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # sign build provenance (Sigstore)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: taxi-api
            context: .
            file: services/api/Dockerfile
          - image: taxi-web
            context: services/web
            file: services/web/Dockerfile
          - image: taxi-gateway
            context: infra/gateway
            file: infra/gateway/Dockerfile
          - image: taxi-mlflow
            context: infra/mlflow
            file: infra/mlflow/Dockerfile
          - image: taxi-airflow
            context: .
            file: orchestration/airflow/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # exactly the commit CI tested
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64           # the server's architecture
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true                       # software bill of materials attached to the image
          provenance: mode=max
          cache-from: type=gha,scope=cd-${{ matrix.image }}
          cache-to: type=gha,scope=cd-${{ matrix.image }},mode=max
      - name: Attest build provenance (verifiable with `gh attestation verify`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
